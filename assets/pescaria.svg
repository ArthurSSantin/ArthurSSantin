<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 170" width="800" height="170" role="img" aria-label="Animação: uma boia de pesca balançando na água enquanto um peixe pula">
  <style>
    .sky { fill: #eef2f0; }
    .water { fill: #b9d3cb; }
    .wave { fill: none; stroke: #8fb7ab; stroke-width: 2; stroke-linecap: round; }
    .ink { stroke: #14201c; }
    .fish { fill: #2d6a4f; }
    .ripple { fill: none; stroke: #f2f7f5; stroke-width: 1.5; opacity: 0; }
    .label { fill: #14201c; font: 600 15px "Segoe UI", system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .sky { fill: #0d1117; }
      .water { fill: #173a33; }
      .wave { stroke: #1e4b41; }
      .ink { stroke: #c9d6d0; }
      .fish { fill: #7fd1b5; }
      .ripple { stroke: #7fd1b5; }
      .label { fill: #c9d6d0; }
    }

    .bobber { animation: bob 2.4s ease-in-out infinite; transform-origin: 560px 92px; }
    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(0); }
      25% { transform: translateY(3px) rotate(-4deg); }
      50% { transform: translateY(-1px) rotate(0); }
      62% { transform: translateY(9px) rotate(5deg); }
      70% { transform: translateY(1px) rotate(-3deg); }
    }
    .r1 { animation: ripple 2.4s ease-out infinite; transform-origin: 560px 100px; }
    .r2 { animation: ripple 2.4s ease-out .5s infinite; transform-origin: 560px 100px; }
    @keyframes ripple {
      0% { transform: scale(.3); opacity: 0; }
      15% { opacity: .9; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    .jump { animation: jump 4.8s ease-in-out infinite; transform-origin: 0 0; }
    @keyframes jump {
      0%, 55% { transform: translate(180px, 130px) rotate(-55deg); opacity: 0; }
      58% { opacity: 1; }
      68% { transform: translate(235px, 58px) rotate(0deg); }
      80% { transform: translate(290px, 130px) rotate(55deg); opacity: 1; }
      82%, 100% { transform: translate(290px, 140px) rotate(55deg); opacity: 0; }
    }
    .splash { animation: splash 4.8s ease-out infinite; transform-origin: 290px 104px; }
    @keyframes splash {
      0%, 79% { transform: scale(.2); opacity: 0; }
      82% { opacity: .9; }
      95%, 100% { transform: scale(1.5); opacity: 0; }
    }

    .wv1 { animation: drift 6s linear infinite; }
    .wv2 { animation: drift 9s linear infinite reverse; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-80px); } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .jump { opacity: 0; }
    }
  </style>

  <rect class="sky" width="800" height="170"/>
  <rect class="water" y="96" width="800" height="74"/>

  <g class="wave wv1">
    <path d="M0 116 q20 -6 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0"/>
  </g>
  <g class="wave wv2">
    <path d="M0 140 q30 -6 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0"/>
  </g>

  <!-- vara e linha -->
  <path class="ink" d="M800 6 L700 28" stroke-width="4" stroke-linecap="round"/>
  <path class="ink" d="M700 28 Q640 40 560 84" fill="none" stroke-width="1.2" opacity=".7"/>

  <!-- ondinhas da boia -->
  <ellipse class="ripple r1" cx="560" cy="100" rx="26" ry="6"/>
  <ellipse class="ripple r2" cx="560" cy="100" rx="26" ry="6"/>

  <!-- boia -->
  <g class="bobber">
    <line class="ink" x1="560" y1="74" x2="560" y2="84" stroke-width="2"/>
    <circle cx="560" cy="93" r="10" fill="#ffffff"/>
    <path d="M550 93 a10 10 0 0 1 20 0 z" fill="#d8432a"/>
  </g>

  <!-- peixe pulando -->
  <g class="jump">
    <g class="fish">
      <ellipse cx="0" cy="0" rx="18" ry="8"/>
      <path d="M-16 0 L-30 -9 L-27 0 L-30 9 Z"/>
      <path d="M-2 -7 L4 -14 L8 -6 Z"/>
    </g>
    <circle cx="10" cy="-2" r="1.8" fill="#14201c"/>
  </g>
  <ellipse class="ripple splash" cx="290" cy="104" rx="22" ry="5"/>

  <text class="label" x="24" y="40">Pesque uma curiosidade logo abaixo.</text>
</svg>
